name: tests

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  pytest:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.10', '3.12']
    defaults:
      run:
        working-directory: user-interface-module
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install
        run: pip install -r requirements-dev.txt

      - name: pytest
        run: python -m pytest -q

      - name: Replay the demo mission headless
        run: |
          PYTHONPATH=src python -m venus_basestation --source jsonl \
            --jsonl-path examples/demo_mission.jsonl --headless \
            --save-state outputs/state.json --save-figure outputs/mission.svg
