[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "venus-basestation"
version = "0.3.4"
description = "Base station for the Venus exploration robots: MQTT/JSONL telemetry, map state and a Tk mission-control dashboard."
requires-python = ">=3.10"
dependencies = [
  "paho-mqtt>=2.1.0",
]

[project.optional-dependencies]
dashboard = [
  "matplotlib>=3.8.0",
]
dev = [
  "pytest>=8.0.0",
]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
